name: "Build kernels"

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

jobs:
  Build-KSU:
    name: "🐎 Build KernelSU + SUSFS + NoMount kernel"
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: "😄 Checkout"
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: "⭐ Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bzip2 zip unzip wget curl \
            ccache libssl-dev flex bison python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: "🚀 Build (KernelSU v3.4.0-legacy + SUSFS v2.3.0 + NoMount)"
        run: bash ./nova-build.sh -k

      - name: "💾 Upload AnyKernel3 zip"
        uses: actions/upload-artifact@v7
        with:
          name: NoVA-KSU-${{ github.sha }}
          path: NoVA-KSU-*.zip
          if-no-files-found: error
